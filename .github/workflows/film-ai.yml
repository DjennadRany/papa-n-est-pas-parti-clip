name: Generate and assemble 48 AI film shots

on:
  schedule:
    - cron: '20 9 * * *'
  push:
    paths:
      - '.github/workflows/film-ai.yml'
  workflow_dispatch:
    inputs:
      max_new_shots:
        description: "Maximum new clips this run (respects daily free GPU quota)"
        type: choice
        options: ["1", "2", "3"]
        default: "2"
permissions:
  contents: read
  actions: read
concurrency:
  group: papa-ai-film
  cancel-in-progress: false
jobs:
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Restore all shots produced by prior GitHub Actions runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ai/restore_artifacts.py
      - name: Install generator and editor
        run: |
          pip install -r ai/requirements.txt
          npm install --no-audit --no-fund
      - name: Generate ONLY missing shots (stop immediately on quota)
        env:
          MAX_NEW_SHOTS: ${{ inputs.max_new_shots || '2' }}
        shell: bash
        run: |
          set +e
          generated=0
          quota=0
          for n in $(seq 1 48); do
            name=$(printf '%02d' "$n")
            if [ -s "public/assets/video/$name.mp4" ]; then
              echo "Scene $name already saved; skipping"
              continue
            fi
            if [ "$generated" -ge "$MAX_NEW_SHOTS" ]; then
              echo "New-shots limit reached ($MAX_NEW_SHOTS); next missing scene: $name"
              break
            fi
            echo "Generating scene $name..."
            python ai/generate.py --scene "$n" --duration 3.5
            code=$?
            if [ "$code" -eq 75 ]; then
              echo "::warning::Hugging Face ZeroGPU quota exhausted. Stopping gracefully; generated clips will be saved."
              quota=1
              break
            elif [ "$code" -ne 0 ]; then
              echo "::warning::Scene $name failed (exit code $code). Stop to investigate; footage remains preserved."
              break
            fi
            generated=$((generated + 1))
          done
          count=$(find public/assets/video -name '*.mp4' | wc -l)
          echo "Available AI shots: $count/48; generated this run: $generated"
          echo "QUOTA_EXHAUSTED=$quota" >> "$GITHUB_ENV"
          exit 0
      - name: Check progress
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path("public/assets/video") / f"{n:02d}.mp4" for n in range(1, 49)]
          missing = [p.stem for p in files if not p.is_file() or p.stat().st_size < 10000]
          print(f"AI movie footage: {48-len(missing)}/48")
          print("Missing: " + (", ".join(missing) or "none"))
          with open("film-complete.txt", "w") as f:
              f.write("true" if not missing else "false")
          PY
      - name: Render completed full film and original MP3
        if: ${{ hashFiles('film-complete.txt') != '' }}
        shell: bash
        run: |
          if [ "$(cat film-complete.txt)" = "true" ]; then
            npx remotion browser ensure
            npm run render
          else
            echo "Film is not yet complete. No slideshow or fake finished movie will be exported."
          fi
      - name: Save every existing MP4 checkpoint (even on quota)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papa-ai-shots-checkpoint
          path: |
            public/assets/video/*.mp4
            out/*.mp4
          if-no-files-found: warn
          retention-days: 30
