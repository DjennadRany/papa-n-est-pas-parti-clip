name: Produce and assemble AI film (resumable)
on:
  push:
    paths:
      - 'ai/production-trigger.txt'
  workflow_dispatch:
    inputs:
      max_new_shots:
        description: "Maximum new AI shots to request this run"
        type: choice
        options: ['0','1','2','3']
        default: '1'
  schedule:
    # Retry at staggered intervals; Wan ZeroGPU quota may reset between attempts.
    - cron: '17 1,7,13,19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: papa-ai-film
  cancel-in-progress: false
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previously completed clips (checkpoint, safe transitions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ai/recover_footage.sh
      - name: Install generator
        run: pip install -r ai/requirements.txt
      - name: Clean filename labels from transition illustrations
        run: python ai/prepare_images.py
      - name: Verify source assets and timeline
        run: python -m unittest discover -s ai -p 'test_*.py' -v
      - name: Snapshot existing clips before generation
        run: |
          mkdir -p /tmp/papa-before
          find public/assets/video -maxdepth 1 -name '*.mp4' -printf '%f\n' | sort > /tmp/papa-before/names.txt
          echo "Restored $(wc -l < /tmp/papa-before/names.txt) clips"
      - name: Generate missing clips, stopping when free GPU quota is reached
        env:
          MAX_NEW: ${{ inputs.max_new_shots || '3' }}
        run: python ai/produce.py generate --max-new "$MAX_NEW"
      - name: Identify newly generated shots and write run summary
        if: always()
        shell: bash
        run: |
          mkdir -p new-shots
          find public/assets/video -maxdepth 1 -name '*.mp4' -printf '%f\n' | sort > /tmp/papa-after.txt
          touch /tmp/papa-before/names.txt
          comm -13 /tmp/papa-before/names.txt /tmp/papa-after.txt > /tmp/papa-new.txt
          while IFS= read -r shot; do
            [[ -n "$shot" ]] || continue
            cp "public/assets/video/$shot" "new-shots/$shot"
          done < /tmp/papa-new.txt
          {
            echo '## Production vidéo IA — ce lancement'
            echo "- Vidéos récupérées avant : $(wc -l < /tmp/papa-before/names.txt)"
            echo "- Nouvelles vidéos : $(wc -l < /tmp/papa-new.txt)"
            echo "- Vidéos disponibles après : $(wc -l < /tmp/papa-after.txt) / 48"
            echo '### Plans créés uniquement pendant ce lancement'
            if [[ -s /tmp/papa-new.txt ]]; then
              while IFS= read -r shot; do echo "- $shot — SHA256: $(sha256sum "new-shots/$shot" | cut -d' ' -f1)"; done < /tmp/papa-new.txt
            else
              echo '- Aucun nouveau plan : consulter les logs Wan / quota GPU.'
            fi
            echo 'Le checkpoint cumulatif contient aussi les anciennes vidéos, ce qui est normal.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save only the newly generated videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papa-new-shots-${{ github.run_id }}
          path: new-shots/*.mp4
          if-no-files-found: ignore
          retention-days: 90
      - name: Count and validate footage
        id: check
        shell: bash
        run: |
          python ai/produce.py status
          if python ai/produce.py validate; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo '## 48/48 scenes ready — render the complete film' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install editor
        if: steps.check.outputs.complete == 'true'
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Render full movie with original soundtrack
        if: steps.check.outputs.complete == 'true'
        run: npm run render
      - name: Save progress report
        if: always()
        run: python ai/produce.py status > production-status.json
      - name: Save all finished footage and film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papa-clean-ai-checkpoint-v2
          path: |
            public/assets/video/*.mp4
            out/*.mp4
            production-status.json
          if-no-files-found: warn
          retention-days: 90
