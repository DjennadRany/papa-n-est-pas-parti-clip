name: Produce and assemble AI film (resumable)
on:
  workflow_dispatch:
    inputs:
      max_new_shots:
        description: "Maximum new AI shots to request this run"
        type: choice
        options: ['1','2','3']
        default: '2'
  schedule:
    - cron: '20 9 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: papa-ai-film
  cancel-in-progress: false
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover all nonexpired footage artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p public/assets/video
          python ai/restore_artifacts.py
      - name: Install generator
        run: pip install -r ai/requirements.txt
      - name: Generate missing clips, stopping when free GPU quota is reached
        env:
          MAX_NEW: ${{ inputs.max_new_shots || '2' }}
        run: python ai/produce.py generate --max-new "$MAX_NEW"
      - name: Count and validate footage
        id: check
        shell: bash
        run: |
          python ai/produce.py status
          if python ai/produce.py validate; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install editor
        if: steps.check.outputs.complete == 'true'
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Render full movie with original soundtrack
        if: steps.check.outputs.complete == 'true'
        run: npm run render
      - name: Save all finished footage and film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papa-ai-footage-and-film
          path: |
            public/assets/video/*.mp4
            out/*.mp4
          if-no-files-found: warn
          retention-days: 30
