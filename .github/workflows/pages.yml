name: Publish Studio interface to GitHub Pages
on:
  push:
    paths:
      - 'docs/**'
      - 'scenes.json'
      - 'public/assets/images/**'
      - 'public/assets/audio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static Studio with bundled media
        run: |
          mkdir -p site/assets/images site/assets/audio
          cp docs/index.html docs/studio-core.mjs site/
          cp scenes.json site/scenes.json
          cp ai/scene_prompts.json site/scene_prompts.json
          cp public/assets/images/*.jpg site/assets/images/
          cp public/assets/audio/*.mp3 site/assets/audio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
