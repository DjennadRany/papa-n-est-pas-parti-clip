name: Validate AI film pipeline (no GPU)
on:
  push:
    paths:
      - 'ai/**'
      - 'docs/**'
      - 'scenes.json'
      - 'public/assets/images/**'
      - 'public/assets/audio/**'
      - '.github/workflows/film-ai.yml'
      - '.github/workflows/test-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser timeline and export fallback
        run: node --test docs/studio-core.test.mjs
      - name: Install only CPU test dependencies
        run: pip install pillow numpy opencv-python-headless
      - name: Validate timeline, sources and provider contracts
        run: python -m unittest discover -s ai -p 'test_*.py' -v
      - name: Prepare clean transition illustrations
        run: python ai/prepare_images.py
      - name: Explain clean-runner status (not production progress)
        run: |
          echo 'CPU validation only: this clean runner intentionally has no production MP4s.'
          echo 'Do not interpret ready=0 here as lost footage; use the film-ai workflow progress.'
          python ai/produce.py status
